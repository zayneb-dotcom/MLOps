name: MLOps Pipeline

on:
  push:
    branches: [ credit-card-fraud, main ]
  pull_request:
    branches: [ credit-card-fraud, main ]

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pandera pyyaml
    
    - name: Run data validation
      run: |
        python scripts/validate_data.py --input data/raw/fraudTest.csv --output data/raw/fraudTest_validated.csv
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 scripts/ api/ monitoring/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ api/ monitoring/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check scripts/ api/ monitoring/
      continue-on-error: true

  model-training:
    runs-on: ubuntu-latest
    needs: [data-validation]
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup DVC
      run: |
        pip install dvc
    
    - name: Run preprocessing
      run: |
        python scripts/preprocess.py --input data/raw/fraudTest.csv --output data/processed/transactions_clean.csv --scaler models/scaler.pkl
      continue-on-error: true
    
    - name: Run feature engineering
      run: |
        python scripts/feature_engineering.py --input data/processed/transactions_clean.csv --output data/features/transactions_features.parquet
      continue-on-error: true
    
    - name: Train model
      run: |
        python scripts/train_model.py --input data/features/transactions_features.parquet --model models/xgboost_fraud_model.pkl
      continue-on-error: true
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: models/
      if: success()

  api-tests:
    runs-on: ubuntu-latest
    needs: [model-training]
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model
        path: models/
      continue-on-error: true
    
    - name: Start API server
      run: |
        uvicorn api.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      continue-on-error: true
    
    - name: Test API endpoints
      run: |
        python api/test_api.py
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t fraud-detection-api:latest .
      continue-on-error: true
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name fraud-api fraud-detection-api:latest
        sleep 10
        curl -f http://localhost:8000/health || exit 1
      continue-on-error: true
